name: Update Warp Preview Flake

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      
      - name: Fetch release metadata
        id: release
        run: |
          X86_URL="https://app.warp.dev/download?channel=preview&package=deb"
          ARM64_URL="https://app.warp.dev/download?channel=preview&package=deb_arm64"
          X86_PREFETCH=$(nix store prefetch-file --json --name warp-preview-x86_64-linux.deb "$X86_URL")
          ARM64_PREFETCH=$(nix store prefetch-file --json --name warp-preview-aarch64-linux.deb "$ARM64_URL")

          X86_HASH=$(jq -r .hash <<< "$X86_PREFETCH")
          ARM64_HASH=$(jq -r .hash <<< "$ARM64_PREFETCH")
          X86_DEB=$(jq -r .storePath <<< "$X86_PREFETCH")
          ARM64_DEB=$(jq -r .storePath <<< "$ARM64_PREFETCH")
          VERSION=$(dpkg-deb -f "$X86_DEB" Version)
          ARM64_VERSION=$(dpkg-deb -f "$ARM64_DEB" Version)

          if [ "$VERSION" != "$ARM64_VERSION" ]; then
            echo "Release versions do not match: x86_64=$VERSION, aarch64=$ARM64_VERSION" >&2
            exit 1
          fi

          {
            echo "VERSION=$VERSION"
            echo "X86_HASH=$X86_HASH"
            echo "ARM64_HASH=$ARM64_HASH"
          } >> "$GITHUB_OUTPUT"
      
      - name: Update flake.nix
        run: |
          # Update version (pattern-based, not line-number dependent)
          sed -i -E 's|version = ".*";|version = "${{ steps.release.outputs.VERSION }}";|' flake.nix
          
          # Update architecture-specific hashes
          sed -i -E 's|x86_64-linux = "sha256-[^"]+";|x86_64-linux = "${{ steps.release.outputs.X86_HASH }}";|' flake.nix
          sed -i -E 's|aarch64-linux = "sha256-[^"]+";|aarch64-linux = "${{ steps.release.outputs.ARM64_HASH }}";|' flake.nix
          
          echo "Updated flake.nix with new version and hashes"
      
      - name: Update flake inputs
        run: |
          nix flake update
      
      - name: Build package to verify
        run: |
          echo "Building package to verify changes..."
          nix build .#packages.x86_64-linux.default
      
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git --no-pager diff --stat
          fi
      
      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock
          git commit -m "chore: update warp-terminal-preview to ${{ steps.release.outputs.VERSION }}"
          git push origin main
